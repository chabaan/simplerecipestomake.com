name: Move article images onto the site

on:
  push:
    branches: [main]
    paths:
      - 'scripts/localize-content-images.mjs'
      - '.github/workflows/localize-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-commits
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install browser (for image hosts that block plain downloads)
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Download external images
        run: node scripts/localize-content-images.mjs

      - name: Commit and push if changed
        run: |
          if [ -f .images-changed ]; then
            rm .images-changed
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/articles public/images
            git commit -m "Move article images onto the site"
            git pull --rebase origin main
            git push
          else
            echo "No external images left."
          fi
